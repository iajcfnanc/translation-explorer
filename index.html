}

}

  --bg:#11171b; --surface:#182126; --ink:#e2eaee; --muted:#aabac3;
  --line:#384954; --tmpl:#c7d2d8; --dna:#4cb0cf; --dna-2:#4cb0cf;
  --dna-ink:#0d1a20; --rna:#ef7f5a; --rna-2:#ef7f5a; --rna-ink:#1c0d07;
  --accent:#4cb0cf; --ok:#5cc28a; --ok-bg:#16281e; --bad:#f2766b;

/* BISC 202 tool kit: layout shared by the step-by-step interactive tools.

:root { --gAA: var(--dna); --gAa: var(--target); --gaa: var(--rna); --hw: var(--muted); }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }

.wrap > * { min-width: 0; }
header { display: grid; gap: 4px; }

.steps li.now { color: var(--ink); font-weight: 600; }

.task { background: var(--surface); border: 1px solid var(--accent); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; }
.task p { margin: 0; max-width: 78ch; }
.stage { display: grid; gap: 12px; min-width: 0; }

.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; }
.legend i.line { height: 3px; }
.legend i.dash { height: 0; border-top: 2px dashed var(--ink); background: none !important; }
.readout { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--font-mono); font-size: 0.85rem; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

@media (max-width: 640px) {
  h1 { font-size: 1.15rem; }
  .toolbar .spacer { display: none; }
  #btnCheck { flex: 1 1 100%; }
  .panel { padding: 10px; }
  .chart text { font-size: 13px; }
}

<script>
/* BISC 202 tool kit: the step engine shared by the interactive tools.
   Designed by Tegan Williams for BISC 202 at SFU.

   A tool supplies two objects:
     CORE (pure logic, no DOM, testable in Node):
       { id, prefix, make(seed) -> case (case.variant: 0-35),
         steps: [{ name, bits: {TAG: 1, ...}, judge(C, A) -> [{tag, note?, field?}], model(C, A), wrong(C, A) -> tag }],
         cards: {TAG: {title, text, learn}}, anchors() -> [[name, got, want, tol]] }
       Bits are numbered per step: at most 15 per step (3 base-36 characters), or 20 if CORE.codeWidth = 4.
     UI (DOM):
       { eyebrow, title, footer: [..], brief(C) -> {q, text, given},
         steps: [{ task(C), render(root, C, A, ctx), reveal?(root, C, A, ctx), win(C, A) }],
         done(root, C) }
   Kit.run(CORE, UI) builds the page.
   ctx: { solved, mode, change(), rerender(), flag(field) -> "flag" | "right" | "" , seed } */
(function (root) {
"use strict";
const NS = "http://www.w3.org/2000/svg";

/* ---------- numbers ---------- */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function rtools(R) {
  return {
    ri: (a, b) => a + Math.floor(R() * (b - a + 1)),
    rf: (a, b) => a + R() * (b - a),
    pick: (arr) => arr[Math.floor(R() * arr.length)],
    shuffle: (arr) => { const o = arr.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; },
    binom: (n, p) => { let k = 0; for (let i = 0; i < n; i++) if (R() < p) k++; return k; },
  };
}
/* Accepts 0.25, .25, 25%, 1/16, 1.4e-5, 1.4x10^-5, 1.4×10-5, 1.4×10⁻⁵, 1 in 40,
   and arithmetic: 0.563^2, 0.563², 2*0.563*0.438, 2×0.4×0.6, 1-0.3, (0.2+0.1)/2, 2(0.3)(0.7).
   Letters other than the x for "times" make it NaN. */
const SUPS = "⁰¹²³⁴⁵⁶⁷⁸⁹";
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).trim().toLowerCase().replace(/\s+/g, "").replace(/,/g, "").replace(/[−–]/g, "-")
    .replace(/[⁻⁺]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, (r) => "^(" + r.replace("⁻", "-").replace("⁺", "").replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, (c) => SUPS.indexOf(c)) + ")");
  if (!t) return NaN;
  let m = t.match(/^1in(\d*\.?\d+)$/);
  if (m) return 1 / parseFloat(m[1]);
  let pct = false;
  if (t.endsWith("%")) { pct = true; t = t.slice(0, -1); }
  let v;
  if ((m = t.match(/^([-+]?\d*\.?\d+)[x×*]10\^?\(?([-+]?\d+)\)?$/))) v = parseFloat(m[1]) * Math.pow(10, parseInt(m[2], 10));
  else if ((m = t.match(/^([-+]?\d*\.?\d+)\/(\d*\.?\d+)$/))) v = parseFloat(m[1]) / parseFloat(m[2]);
  else if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/.test(t)) v = parseFloat(t);
  else v = calc(t);
  return pct ? v / 100 : v;
}
/* A small arithmetic reader (no eval): + - * x × · / ^ and brackets; 2(0.3) multiplies. */
function calc(t) {
  const toks = t.match(/\d+\.?\d*(?:e[-+]?\d+)?|\.\d+(?:e[-+]?\d+)?|[-+*x×·/^()]/g);
  if (!toks || toks.join("") !== t) return NaN;
  let i = 0;
  const peek = () => toks[i], take = () => toks[i++];
  function expr() { let v = term(); while (peek() === "+" || peek() === "-") v = take() === "+" ? v + term() : v - term(); return v; }
  function term() {
    let v = unary();
    for (;;) {
      const o = peek();
      if (o === "*" || o === "x" || o === "×" || o === "·") { take(); v *= unary(); }
      else if (o === "/") { take(); v /= unary(); }
      else if (o === "(") v *= unary();
      else return v;
    }
  }
  function unary() { if (peek() === "-") { take(); return -unary(); } if (peek() === "+") { take(); return unary(); } return power(); }
  function power() { const b = atom(); if (peek() === "^") { take(); return Math.pow(b, unary()); } return b; }
  function atom() {
    const k = take();
    if (k === "(") { const v = expr(); if (take() !== ")") throw 0; return v; }
    if (k != null && /^[\d.]/.test(k)) return parseFloat(k);
    throw 0;

  try { const v = expr(); return i === toks.length && isFinite(v) ? v : NaN; } catch (e) { return NaN; }
}
/* True when an answer box holds letters (p, q, A, a …) rather than numbers. */
function hasLetters(s) { return /[a-df-wyzᴬᵃ]/i.test(String(s == null ? "" : s)); }
function near(v, target, tol) {
  if (typeof v !== "number" || !isFinite(v)) return false;
  const d = Math.abs(v - target);
  return (tol.abs != null && d <= tol.abs + 1e-12) || (tol.rel != null && d <= Math.abs(target) * tol.rel + 1e-15);
}
function fmt(v, dp) { return Number(v).toFixed(dp); }
function sig(v, n) {
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (a < 1e-3 || a >= 1e6) { const e = Math.floor(Math.log10(a)); const m = v / Math.pow(10, e); return Number(m.toPrecision(n)) + " × 10" + sup(e); }

}
function sup(e) { return String(e).replace(/-/g, "⁻").replace(/\d/g, (d) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]); }

  const n = Math.round(1 / v);
  return Math.abs(1 / n - v) < 1e-9 ? "1/" + n : sig(v, 3);
}

function genTicks(G) { const st = G <= 10 ? (G <= 5 ? 1 : 2) : G <= 30 ? 10 : G <= 60 ? 20 : G <= 100 ? 25 : 50; const a = []; for (let v = 0; v <= G + 1e-9; v += st) a.push(v); return a; }

/* ---------- DOM ---------- */
function setAttrs(e, attrs) {
  if (!attrs) return;
  for (const [k, v] of Object.entries(attrs)) {

    if (k === "text") e.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else e.setAttribute(k, v === true ? "" : v);

}
function append(e, kids) {
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));

}
function el(tag, attrs, ...kids) { const e = document.createElement(tag); setAttrs(e, attrs); return append(e, kids); }
function s(tag, attrs, ...kids) { const e = document.createElementNS(NS, tag); setAttrs(e, attrs); return append(e, kids); }
function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }
function svg(w, h, label, cls, scale) { return s("svg", { viewBox: `0 0 ${w} ${h}`, class: "chart " + (cls || ""), role: "img", "aria-label": label, style: `max-width:${Math.round(w * (scale || 1.15))}px` }); }

let uid = 0;
/* Radio group. options: [{value, label (string or node)}]. marks: {value: "flag"|"right"} */
function choice({ legend, options, value, onChange, disabled, marks, thumbs, name }) {
  const nm = name || "c" + (++uid);
  const fs = el("fieldset", { class: "answer-options" + (thumbs ? " thumbs" : "") });
  if (legend) fs.append(el("legend", null, legend));
  for (const o of options) {
    const lab = el("label", { class: (marks && marks[o.value]) || "" });
    const r = el("input", { type: "radio", name: nm, value: o.value });
    r.checked = value === o.value; r.disabled = !!disabled;
    r.addEventListener("change", () => onChange(o.value));
    if (thumbs) lab.append(o.label, el("span", { class: "tl" }, r, o.caption || ""));
    else lab.append(r, typeof o.label === "string" ? el("span", null, o.label) : o.label);
    fs.append(lab);
  }
  return fs;
}
function number({ label, value, onInput, hint, disabled, mark, placeholder, aria, calc }) {
  // calc: true gives phones a full keyboard so ^ * ( ) can be typed
  const inp = el("input", { type: "text", inputmode: calc ? "text" : "decimal", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: placeholder || "", "aria-label": aria || null });
  inp.value = value == null ? "" : value; inp.disabled = !!disabled;
  inp.addEventListener("input", () => onInput(inp.value));
  return el("label", { class: "num " + (mark || "") }, el("span", { class: "lab" }, label), inp, hint ? el("span", { class: "hint" }, hint) : null);
}
function range({ label, min, max, step, value, onInput, format }) {
  const out = el("output", null, format ? format(value) : value);
  const inp = el("input", { type: "range", min, max, step, value });

  const w = 980, h = 590, x0 = Math.max(0, Math.min(r.W - w, px - w / 2)), y0 = 30;
  const svg = r.svg.replace(/width="\d+" height="\d+" viewBox="[^"]*"/, `width="${w}" height="${h}" viewBox="${x0} ${y0} ${w} ${h}"`);
  const box = el("div", { class: "trfig", role: "group", "aria-label": label });
  box.innerHTML = svg;
  return box;
}
const codeBox = () => {
  const B = "UCAG", t = el("table", { class: "codes" }), hr = el("tr", null, el("th", null, "1st \\ 2nd"));
  for (const b of B) hr.append(el("th", null, b));
  t.append(hr);
  for (const a of B) {
    const tr = el("tr", null, el("th", null, a));
    for (const b of B) { const td = el("td"); for (const c of B) { const cod = a + b + c, aa = M.code[cod]; td.append(el("div", { class: aa === "Stop" ? "stop" : "" }, cod + " " + aa)); } tr.append(td); }
    t.append(tr);
  }
  return el("details", { class: "codebox" }, el("summary", null, "Genetic code table (mRNA codons, 5′ → 3′)"), t);
};
const marks = (ctx, A, field, rightValue) => (ctx.solved ? { [rightValue]: "right" } : ctx.flag(field) ? { [A[field]]: "flag" } : {});
function ask(pan, ctx, A, field, legend, opts) {
  pan.append(K.choice({ legend, options: opts.map((o) => ({ value: o.value, label: o.label || o.value })), value: A[field], disabled: ctx.solved,
    marks: marks(ctx, A, field, C0.right(opts)), onChange: (v) => { A[field] = v; ctx.change(); } }));
}
const swipe = () => el("p", { class: "note swipe" }, "Swipe the diagram sideways to see all of it.");
const num = (i) => i + 1; // codon numbers as printed under the mRNA in the figure

function startStep(root, C, A, ctx) {
  const pan = el("div", { class: "panel" }, el("h2", null, "The mRNA"),
    el("p", { class: "note" }, "Click the base where translation starts. Any base of the start codon counts. Click another base to change your answer."));
  const row = el("div", { class: "mrna", role: "group", "aria-label": "mRNA bases, 5′ to 3′" });
  row.append(el("span", { class: "end" }, "5′"));
  [...C.seq].forEach((b, i) => {
    const n = i + 1, cls = ["b"];
    if (ctx.solved && n >= C.start && n <= C.start + 2) cls.push("ok");
    else if (A.pick === n) cls.push(ctx.flag("pick") ? "flag" : "sel");
    const btn = el("button", { type: "button", class: cls.join(" "), "aria-label": "base " + n + ", " + b, "aria-pressed": A.pick === n ? "true" : "false" }, b);
    if (ctx.solved) btn.disabled = true;
    btn.addEventListener("click", () => { A.pick = n; ctx.change(); ctx.rerender(); const bs = document.querySelectorAll(".mrna button.b"); if (bs[i]) bs[i].focus({ preventScroll: true }); });
    row.append(btn);
  });
  row.append(el("span", { class: "end" }, "3′"));
  pan.append(row);
  root.append(pan);
}
function startReveal(root, C) {
  root.append(el("div", { class: "panel" }, el("h2", null, "Initiation complete"),
    figure(C, { phase: "joined", p: 0 }, "Ribosome assembled on the start codon, Met in the P site"),
    el("p", { class: "note" }, "The large subunit has joined. The initiator tRNA, carrying Met, is in the P site over the start codon. The A site is empty.")));
}

function trnaStep(root, C, A, ctx) {
  const pan = el("div", { class: "panel" }, el("h2", null, "The ribosome, ready for the next tRNA"), swipe(),
    figure(C, { phase: "empty", p: C.k }, "Ribosome with codon " + (C.k + 1) + " in the P site and the A site empty"), codeBox());
  ask(pan, ctx, A, "anti", "Which anticodon does the tRNA that enters the A site have? (Written 3′ → 5′, lined up under the codon.)", C0_anti(C));
  ask(pan, ctx, A, "aa", "Which amino acid does that tRNA carry?", C.opt2.aa);
  root.append(pan);
}
const C0_anti = (C) => C.opt2.anti.map((o) => ({ value: o.value, tag: o.tag, label: "3′-" + o.value + "-5′" }));
function trnaReveal(root, C) {
  root.append(el("div", { class: "panel" }, el("h2", null, "The tRNA is in the A site"),
    figure(C, { phase: "bound", p: C.k }, "Charged tRNA bound in the A site"),
    el("p", { class: "note" }, "Codon " + (C.k + 2) + " is in the A site. Its tRNA brings " + C.codons[C.k + 1] + "'s amino acid, " + CORE.right(C.opt2.aa) + ".")));
}

function bondStep(root, C, A, ctx) {
  const pan = el("div", { class: "panel" }, el("h2", null, "A charged tRNA is in the A site"), swipe(),
    figure(C, { phase: "bound", p: C.k2 }, "tRNAs in the P and A sites, codon " + (C.k2 + 1) + " in P and codon " + (C.k2 + 2) + " in A"));
  ask(pan, ctx, A, "tx", "The peptide bond forms. What happens to the chain?", C.opt3.tx);
  ask(pan, ctx, A, "pos", "Then the ribosome translocates. Where is it now?", C.opt3.pos);
  root.append(pan);
}
function bondReveal(root, C) {
  const pan = el("div", { class: "panel" }, el("h2", null, "After the peptide bond and translocation"));
  pan.append(figure(C, { phase: "transfer", p: C.k2 }, "After the peptide bond: the chain is on the A-site tRNA"),
    figure(C, { phase: "moved", p: C.k2 + 1 }, "After translocation: codon " + (C.k2 + 2) + " in P, codon " + (C.k2 + 3) + " in A, an empty tRNA in E"),
    el("p", { class: "note" }, "Top: the chain is now on the tRNA in the A site and the P-site tRNA is empty. Bottom: the ribosome has moved one codon toward the 3′ end. The empty tRNA is in the E site, and the A site is open for the next tRNA."));
  root.append(pan);
}

function stopStep(root, C, A, ctx) {
  const pan = el("div", { class: "panel" }, el("h2", null, "A stop codon reaches the A site"), swipe(),
    figure(C, { phase: "moved", p: C.sense - 1 }, "Stop codon " + C.stopCodon + " in the A site"), codeBox());
  ask(pan, ctx, A, "rf", "What happens at the stop codon?", C.opt4.rf);
  ask(pan, ctx, A, "pep", "Which chain is released? (N-terminus first)", C.opt4.pep);
  root.append(pan);
}
function stopReveal(root, C) {
  root.append(el("div", { class: "panel" }, el("h2", null, "Termination"),
    figure(C, { phase: "stop", p: C.sense - 1 }, "Release factor in the A site"),
    figure(C, { phase: "released", p: C.sense - 1 }, "Finished chain released"),
    el("p", { class: "note" }, "A release factor binds the stop codon. The chain is released from the last tRNA: " + C0.dash(C.peptide) + ".")));
}

/* The model's own sequence of states, with a caption for each. */
const CAPTION = {
  early: () => "Start-site inspection: the small subunit, the initiator tRNA and initiation factors have attached at the 5′ cap and scanned along to the first AUG.",
  late: () => "The initiator tRNA is paired with the start codon. The large subunit is about to join.",
  joined: () => "The large subunit has joined. The initiator tRNA, carrying Met, is in the P site over the start codon. The A site is empty.",
  empty: () => "The A site is empty and ready for the next tRNA.",
  bound: (s, C) => "A charged tRNA enters the A site: its anticodon 3′-" + M.anticodon(C.codons[s.p + 1]) + "-5′ pairs with codon " + (s.p + 2) + " (" + C.codons[s.p + 1] + ").",
  transfer: () => "Peptide bond: the chain moves from the P-site tRNA onto the amino acid on the A-site tRNA.",
  moved: () => "Translocation: the ribosome moves one codon toward the 3′ end. The empty tRNA is in the E site and will leave. The A site is open again.",
  stop: () => "A stop codon is in the A site. No tRNA pairs with it. A release factor binds instead.",
  released: () => "The chain is released from the last tRNA. Translation of this mRNA is finished.",
};
function explore(root, C) {
  let sys = C.bact ? "bacterial" : "euk", i = 0, list = [];
  const pan = el("div", { class: "panel" }, el("h2", null, "Explore: step the ribosome"),
    el("p", { class: "note" }, "Move through the whole translation of this mRNA, one event at a time. The caption says what is happening."));
  const out = el("div"), cap = el("p", { class: "caption", "aria-live": "polite" }), pos = el("span", { class: "note" });
  const back = el("button", { class: "btn", type: "button" }, "← Back"), fwd = el("button", { class: "btn primary", type: "button" }, "Next →");
  const select = el("select", { "aria-label": "Type of cell" }, el("option", { value: "bacterial" }, "Bacterium (50S and 30S)"), el("option", { value: "euk" }, "Eukaryote (60S and 40S)"));
  select.value = sys;
  const build = () => {
    list = []; let s = M.load({ sequence: C.seq, start: C.start, system: sys, theme: "course", fmet: false, motion: false, phase: sys === "euk" ? "early" : "joined", p: 0 });
    for (;;) { list.push(s); try { s = M.next(s); } catch (e) { break; } }
    i = Math.min(i, list.length - 1);
  };
  const draw = () => {
    K.clear(out);
    const s = list[i];
    out.append(swipe(), figure(C, { phase: s.phase, p: s.p }, "State " + (i + 1) + " of " + list.length, sys));
    cap.textContent = CAPTION[s.phase](s, C);
    pos.textContent = "Event " + (i + 1) + " of " + list.length;
    back.disabled = i === 0; fwd.disabled = i === list.length - 1;
  };
  back.addEventListener("click", () => { if (i > 0) { i--; draw(); } });
  fwd.addEventListener("click", () => { if (i < list.length - 1) { i++; draw(); } });
  select.addEventListener("change", () => { sys = select.value; i = 0; build(); draw(); });
  build(); draw();
  pan.append(el("div", { class: "stepbar" }, el("label", null, "Cell", select), back, fwd, pos), cap, out);
  root.append(pan);
}

return {
  eyebrow: "BISC 202 · Week 11 · Translation",
  title: "Translation: step the ribosome",
  newLabel: "New mRNA",
  footer: ["Invented mRNAs with the standard genetic code, drawn with the same ribosome figures as the lecture. Initiator tRNA is labelled Met. Klug Chapter 14.",
    "Eukaryotic mRNAs here have no AUG before the start codon; bacterial mRNAs have a Shine–Dalgarno sequence (AGGAGG) just upstream of it."],
  brief(C) {
    return { q: "Follow the ribosome along this mRNA.", text: C.bact ? "This is a bacterial mRNA, written 5′ → 3′." : "This is a eukaryotic mRNA, written 5′ → 3′, with a cap at its 5′ end.", given: "5′-" + C.seq + "-3′" };
  },
  steps: [
    { task: () => "Click the base where translation starts on this mRNA.", render: startStep, reveal: startReveal,
      win: (C) => C.bact ? "The small subunit's rRNA pairs with the Shine–Dalgarno sequence (AGGAGG), which places the AUG at base " + C.start + " in the P site." +
        (C.decoy ? " The AUG at base " + C.first + " comes before the Shine–Dalgarno sequence, so it is not used." : "")
        : "The small subunit attaches at the 5′ cap and scans along the mRNA. The first AUG it reaches, at base " + C.start + ", is the start codon.",
      winTitle: () => "Right: translation starts at the AUG" },
    { task: (C) => "Codon " + (C.k + 1) + " is in the P site. Choose the tRNA that enters the A site, which holds codon " + (C.k + 2) + ".", render: trnaStep, reveal: trnaReveal,
      win: (C) => "The A-site codon is " + C.codons[C.k + 1] + ". The anticodon pairs with it base by base: 3′-" + CORE.comp(C.codons[C.k + 1]) + "-5′. That codon codes for " + CORE.right(C.opt2.aa) + ".",
      winTitle: () => "Right: the tRNA pairs with the A-site codon" },
    { task: (C) => "A charged tRNA is in the A site, with codon " + (C.k2 + 1) + " in P and codon " + (C.k2 + 2) + " in A. Answer both questions.", render: bondStep, reveal: bondReveal,
      win: (C) => "The peptide bond is made by moving the chain from the P-site tRNA to the amino acid on the A-site tRNA. Then the ribosome moves one codon toward the 3′ end, so codon " + (C.k2 + 2) + " is in P and codon " + (C.k2 + 3) + " is in A.",
      winTitle: () => "Right: the chain moves, then the ribosome moves" },
    { task: (C) => "The ribosome has moved until the stop codon (codon " + (C.sense + 1) + ", " + C.stopCodon + ") is in the A site. Answer both questions.", render: stopStep, reveal: stopReveal,
      win: (C) => "No tRNA pairs with " + C.stopCodon + ". A release factor binds the A site and the chain is released. The chain has " + C.peptide.length + " amino acids: " + CORE.dash(C.peptide) + ". The stop codon adds nothing.",
      winTitle: () => "Right: a release factor ends translation" },
  ],
  doneTitle: "mRNA translated",
  doneText: () => "You followed one mRNA from the start codon to the release of the chain. Step through it below, or press “Try a new case”.",
  done: explore,
};
})();
